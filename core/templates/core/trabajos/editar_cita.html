{% extends 'core/base.html' %}
{% block Principal %}
<div class="container py-5">
    <h2 class="text-center mb-4">Editar Cita</h2>
    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 mt-3">Guardar Cambios</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
