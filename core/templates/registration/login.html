<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Credencial</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <!-- Card -->
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Ingreso de usuario</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-center text-muted">Por favor, ingresa tus credenciales para acceder</p>
                        <hr>
                        <!-- Formulario -->
                        <form action="" method="post">
                            {% csrf_token %}

                            <!-- Campo de Nombre de Usuario -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Nombre de Usuario</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                            </div>

                            <!-- Campo de Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                            </div>

                            <!-- Botón de Enviar -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Registrate</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <small class="text-muted">¿Olvidaste tu contraseña? <a href="#" class="text-primary">Recupérala aquí</a></small>
                        <br>
                        <small class="text-muted">Homer: <a href="{% url 'index' %}" class="text-primary">ir a homer</a></small> | 
                        <small class="text-muted"> Registrate: <a href="{% url 'registro' %}" class="text-primary">Registrate</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap Bundle JS (opcional para interactividad de Bootstrap como tooltips o modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
